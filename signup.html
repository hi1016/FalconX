<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | FalconX</title>
  <meta name="description" content="Create a FalconX demo account and choose a plan.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
  <div id="site-header"></div>
  <script src="js/header.js"></script>
  <main id="content" class="auth-wrap">
    <form class="auth-card form" id="signup-form">
      <h1>Create your FalconX account</h1>
      <p class="help">Checkout is simulated. Do not use a real password. It is stored only in this browser.</p>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Plan
        <select name="plan">
          <option value="month">1 month · $29</option>
          <option value="year">1 year · $180</option>
          <option value="year2" selected>2 years · $300</option>
          <option value="business">Business · talk to sales</option>
          <option value="vip">VIP · $24 / month</option>
        </select>
      </label>
      <button class="btn btn-solid" type="submit">Create account</button>
      <p class="banner" id="signup-msg" hidden></p>
      <p>Already registered? <a class="text-link" href="login.html">Log in</a></p>
    </form>
  </main>
  <div id="site-footer"></div>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
