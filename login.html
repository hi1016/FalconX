<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | FalconX-Fast VPN Proxy</title>
  <meta name="description" content="Log in to a FalconX-Fast VPN Proxy demo account stored in this browser.">
  <link rel="icon" href="images/app-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <div id="site-header"></div>
  <script src="js/header.js"></script>
  <main id="content" class="auth-wrap">
    <form class="auth-card form" id="login-form">
      <h1>Log in</h1>
      <p class="help">Use the email and password you created on this browser.</p>
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-solid" type="submit">Log in</button>
      <p class="banner warn" id="login-msg" hidden></p>
      <p>New here? <a class="text-link" href="signup.html">Create an account</a></p>
    </form>
  </main>
  <div id="site-footer"></div>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
